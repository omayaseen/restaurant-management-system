{% extends 'base.html' %}

{% block content %}

<h2 class="mb-4">
    Manage Orders
</h2>

<table class="table table-bordered table-hover">

    <thead class="table-dark">

        <tr>

            <th>ID</th>

            <th>Customer</th>

            <th>Status</th>

            <th>Date</th>

        </tr>

    </thead>

    <tbody>

        {% for order in orders %}

        <tr>

            <td>{{ order.id }}</td>

            <td>{{ order.customer.username }}</td>

            <td>

                <form
                    method="POST"
                    action="{% url 'update_order_status' order.id %}">

                    {% csrf_token %}

                    <select
                        name="status"
                        class="form-select form-select-sm">

                        <option value="pending"
                        {% if order.status == 'pending' %}selected{% endif %}>
                            Pending
                        </option>

                        <option value="preparing"
                        {% if order.status == 'preparing' %}selected{% endif %}>
                            Preparing
                        </option>

                        <option value="ready"
                        {% if order.status == 'ready' %}selected{% endif %}>
                            Ready
                        </option>

                        <option value="delivered"
                        {% if order.status == 'delivered' %}selected{% endif %}>
                            Delivered
                        </option>

                        <option value="cancelled"
                        {% if order.status == 'cancelled' %}selected{% endif %}>
                            Cancelled
                        </option>

                    </select>

                    <button
                        class="btn btn-success btn-sm mt-2">

                        Update

                    </button>

                </form>

            </td>

            <td>{{ order.order_date }}</td>

        </tr>

        {% endfor %}

    </tbody>

</table>

{% endblock %}
