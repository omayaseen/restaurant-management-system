{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-6">

        <div class="card shadow-sm border-danger-subtle">

            <div class="card-body p-4 text-center">

                <h4 class="card-title text-danger mb-3">Delete Menu Item</h4>

                <p class="mb-4">
                    Are you sure you want to delete <strong>{{ menu.name }}</strong>?
                    This action cannot be undone.
                </p>

                <form method="POST" class="d-flex justify-content-center gap-2">

                    {% csrf_token %}

                    <button type="submit" class="btn btn-danger">
                        Delete
                    </button>

                    <a href="{% url 'menu_list' %}" class="btn btn-outline-secondary">
                        Cancel
                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
